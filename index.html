<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle de Conexão</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  padding:30px;
}

h1{
  text-align:center;
  font-size:46px;
  margin-bottom:10px;

  background:linear-gradient(90deg,#00aaff,#cc00ff);

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  text-align:center;
  color:#999;
  margin-bottom:30px;
}

.top{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:30px;
}

input{
  background:#121212;
  border:1px solid #222;
  color:white;
  padding:10px;
  border-radius:10px;
  outline:none;
}

button{
  background:#1f1f1f;
  border:none;
  color:white;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
}

button:hover{
  background:#333;
}

.add-btn{
  background:#0066ff;
}

.delete-btn{
  background:#a61d24;
}

.unlock-btn{
  background:#0f8b4c;
}

.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
}

.card{
  width:390px;
  background:#0d0d0d;
  border:1px solid #1f1f1f;
  border-radius:20px;
  overflow:hidden;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px;
  border-bottom:1px solid #1f1f1f;
}

.block-title{
  width:180px;
  font-weight:bold;
}

.badge{
  background:#1b1b1b;
  padding:5px 10px;
  border-radius:12px;
  font-size:12px;
  color:#aaa;
}

.table-wrap{
  max-height:420px;
  overflow-y:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  padding:12px;
  text-align:left;
  font-size:12px;
  color:#777;
  border-bottom:1px solid #1f1f1f;
}

td{
  padding:10px;
  border-bottom:1px solid #161616;
}

select{
  width:100%;
  padding:8px;
  border:none;
  border-radius:20px;
  color:white;
  font-weight:bold;
}

.on{
  background:#0f8b4c;
}

.off{
  background:#a61d24;
}

.actions{
  padding:15px;
  display:flex;
  justify-content:center;
  gap:10px;
}

button:disabled,
input:disabled,
select:disabled{
  opacity:.45;
  cursor:not-allowed;
}

</style>
</head>

<body>

<h1>Controle de Conexão</h1>

<p class="subtitle">
Monitoramento de números e status
</p>

<div class="top">

  <input
    type="password"
    id="senhaInput"
    placeholder="Digite a senha"
  >

  <button
    class="unlock-btn"
    onclick="liberarEdicao()"
  >
    Confirmar senha
  </button>

  <button
    class="add-btn"
    onclick="addBlock()"
  >
    + Adicionar Bloco
  </button>

</div>

<p
id="modo"
style="
text-align:center;
margin-bottom:20px;
color:#999;
"
>
Modo visualização
</p>

<div
class="container"
id="dashboard"
></div>

<script>

let podeEditar = false;

let data = [

{
  name:"Geral",
  rows:[
    {
      numero:"1964",
      status:"ON",
      observacao:"Ativo"
    },
    {
      numero:"2515",
      status:"OFF",
      observacao:"Parado"
    }
  ]
}

];

function liberarEdicao(){

  const senha =
  document.getElementById("senhaInput").value;

  if(senha === "123456"){

    podeEditar = true;

    document.getElementById("modo").innerText =
    "Modo edição liberado";

    alert("Edição liberada");

  }else{

    podeEditar = false;

    document.getElementById("modo").innerText =
    "Modo visualização";

    alert("Senha incorreta");

  }

  render();

}

function bloquear(){

  if(!podeEditar){

    alert("Você não tem permissão para editar");

    return true;

  }

  return false;

}

function render(){

  const dashboard =
  document.getElementById("dashboard");

  dashboard.innerHTML = "";

  data.forEach((card,cardIndex)=>{

    const totalON =
    card.rows.filter(r => r.status === "ON").length;

    const div =
    document.createElement("div");

    div.className = "card";

    div.innerHTML = `

    <div class="header">

      <input
        class="block-title"
        value="${card.name}"
        ${!podeEditar ? "disabled" : ""}
        oninput="changeBlockName(${cardIndex},this.value)"
      >

      <div class="badge">
        ${totalON} ON / ${card.rows.length}
      </div>

    </div>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>NÚMERO</th>
            <th>STATUS</th>
            <th>OBS</th>
            <th>AÇÃO</th>
          </tr>

        </thead>

        <tbody>

        ${card.rows.map((row,rowIndex)=>`

        <tr>

          <td>

            <input
              value="${row.numero}"
              ${!podeEditar ? "disabled" : ""}
              oninput="updateField(${cardIndex},${rowIndex},'numero',this.value)"
            >

          </td>

          <td>

            <select
              class="${row.status === 'ON' ? 'on' : 'off'}"
              ${!podeEditar ? "disabled" : ""}
              onchange="changeStatus(this,${cardIndex},${rowIndex})"
            >

              <option
              value="ON"
              ${row.status === 'ON' ? 'selected' : ''}
              >
              ON
              </option>

              <option
              value="OFF"
              ${row.status === 'OFF' ? 'selected' : ''}
              >
              OFF
              </option>

            </select>

          </td>

          <td>

            <input
              value="${row.observacao}"
              ${!podeEditar ? "disabled" : ""}
              oninput="updateField(${cardIndex},${rowIndex},'observacao',this.value)"
            >

          </td>

          <td>

            <button
              class="delete-btn"
              ${!podeEditar ? "disabled" : ""}
              onclick="removeRow(${cardIndex},${rowIndex})"
            >
            X
            </button>

          </td>

        </tr>

        `).join("")}

        </tbody>

      </table>

    </div>

    <div class="actions">

      <button
        ${!podeEditar ? "disabled" : ""}
        onclick="addRow(${cardIndex})"
      >
      + Linha
      </button>

      <button
        class="delete-btn"
        ${!podeEditar ? "disabled" : ""}
        onclick="removeBlock(${cardIndex})"
      >
      Excluir
      </button>

    </div>

    `;

    dashboard.appendChild(div);

  });

}

function updateField(card,row,field,value){

  if(bloquear()) return;

  data[card].rows[row][field] = value;

}

function changeStatus(el,card,row){

  if(bloquear()) return;

  data[card].rows[row].status = el.value;

  render();

}

function changeBlockName(card,value){

  if(bloquear()) return;

  data[card].name = value;

}

function addRow(card){

  if(bloquear()) return;

  data[card].rows.push({
    numero:"",
    status:"ON",
    observacao:""
  });

  render();

}

function removeRow(card,row){

  if(bloquear()) return;

  data[card].rows.splice(row,1);

  render();

}

function addBlock(){

  if(bloquear()) return;

  data.push({

    name:"Novo Bloco",

    rows:[
      {
        numero:"",
        status:"ON",
        observacao:""
      }
    ]

  });

  render();

}

function removeBlock(card){

  if(bloquear()) return;

  data.splice(card,1);

  render();

}

render();

</script>

</body>
</html>
